# Insurance Claim Platform Business Ruleset v1
ruleset_version: "v1"
engine_version: "1.0.0"

validation_rules:
  V01:
    name: "Policy Exists & Belongs"
    version: "1.0"
    reason_code_not_found: "POLICY_NOT_FOUND"
    reason_code_mismatch: "POLICY_OWNER_MISMATCH"
  V02:
    name: "Policy Active"
    version: "1.0"
    reason_code: "POLICY_NOT_ACTIVE"
  V03:
    name: "Incident in Policy Period"
    version: "1.0"
    reason_code: "INCIDENT_OUTSIDE_POLICY_PERIOD"
  V04:
    name: "Valid Incident Date"
    version: "1.0"
    reason_code: "INCIDENT_DATE_INVALID"
  V05:
    name: "Filing Window"
    version: "1.0"
    filing_window_days: 90
    reason_code: "FILING_WINDOW_EXCEEDED"
  V07:
    name: "Coverage Exists"
    version: "1.0"
    reason_code: "NO_COVERAGE"
  V08:
    name: "Policy Exclusion Check"
    version: "1.0"
    reason_code: "EXCLUDED"
  V09:
    name: "Waiting Period"
    version: "1.0"
    reason_code: "WAITING_PERIOD_NOT_MET"
  V10:
    name: "Positive Requested Amount"
    version: "1.0"
    reason_code: "AMOUNT_INVALID"
  V11:
    name: "Coverage Limit Check"
    version: "1.0"
    reason_code: "LIMIT_EXCEEDED"
  V12:
    name: "Mandatory Fields"
    version: "1.0"
    reason_code: "MISSING_FIELD"
  V13:
    name: "Document Lifecycle"
    version: "1.0"
    reason_code_missing: "DOCUMENTS_MISSING"
    reason_code_invalid: "DOCUMENT_INVALID"
    reason_code_pending: "DOCUMENT_PENDING_REVIEW"

risk_groups:
  FREQUENCY:
    cap: 25
    description: "Claim frequency indicators"
  AMOUNT:
    cap: 25
    description: "Claim amount indicators"
  TIMING:
    cap: 20
    description: "Incident and filing timing indicators"
  DUPLICATE:
    cap: 10
    description: "Duplicate claim indicators"
  CONSISTENCY:
    cap: 20
    description: "Document consistency and attestation indicators"

risk_thresholds:
  investigation_score_threshold: 40
  low_max: 19
  medium_max: 39
  high_min: 40
  partial_min_pct: 60
  mandatory_indicators:
    - "R05"
    - "R06"
    - "R07"
    - "R09"
  pilot_banner: "PILOT: Risk indicators are experimental and unvalidated. Manual review required."

risk_indicators:
  R01:
    name: "Repeated incidents by customer"
    version: "1.0"
    rationale: "At least 3 distinct incidents by the customer in the last 12 months indicates elevated claim frequency."
    enabled: true
    group: "FREQUENCY"
    weight: 20
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    threshold_incidents: 3
    threshold_claims: 3
    window_days: 365
  R02:
    name: "Repeated incidents on policy"
    version: "1.0"
    rationale: "At least 2 distinct incidents on the policy in the last 6 months indicates policy-level claiming clustering."
    enabled: true
    group: "FREQUENCY"
    weight: 15
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    threshold_incidents: 2
    threshold_claims: 2
    window_days: 180
  R03:
    name: "High amount vs limit"
    version: "1.0"
    rationale: "Requested amount exceeding 80% of remaining coverage limit."
    enabled: true
    group: "AMOUNT"
    weight: 20
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    limit_ratio_threshold_percent: 80
  R04:
    name: "Unusual amount vs peers"
    version: "1.0"
    rationale: "Requested amount more than 3 times median approved amount for same product and category with baseline peer history."
    enabled: true
    group: "AMOUNT"
    weight: 15
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    peer_multiple_threshold: 3
    min_historical_claims: 10
  R05:
    name: "Early claim"
    version: "1.0"
    rationale: "Incident occurred within 30 days of policy inception."
    enabled: true
    group: "TIMING"
    weight: 15
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    early_claim_window_days: 30
  R06:
    name: "Late-in-policy claim"
    version: "1.0"
    rationale: "Incident occurred within 7 days of policy expiration."
    enabled: true
    group: "TIMING"
    weight: 10
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    late_policy_window_days: 7
  R07:
    name: "Duplicate suspicion"
    version: "1.0"
    rationale: "Same policy, same incident date, and requested amount within 5% variance indicates duplicate filing."
    enabled: true
    group: "DUPLICATE"
    weight: 10
    sufficient_alone: true
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    amount_variance_percent: 5
  R08:
    name: "Inconsistent document data"
    version: "1.0"
    rationale: "Document identity attestation indicates mismatch or pre-incident/future document anomaly."
    enabled: true
    group: "CONSISTENCY"
    weight: 20
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
  R09:
    name: "Late filing"
    version: "1.0"
    rationale: "Claim filed more than 15 days after the incident date."
    enabled: true
    group: "TIMING"
    weight: 5
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    late_filing_window_days: 15
  R10:
    name: "Round-number amount"
    version: "1.0"
    rationale: "Requested amount is an exact round number (multiple of 10,000) of at least 50,000."
    enabled: true
    group: "AMOUNT"
    weight: 5
    sufficient_alone: false
    evidence_level: "NONE"
    applicable_products:
      - "HEALTH"
      - "VEHICLE"
      - "PROPERTY"
    round_multiple: 10000
    min_amount: 50000
