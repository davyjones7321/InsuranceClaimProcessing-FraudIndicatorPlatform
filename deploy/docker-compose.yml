services:
  db:
    image: postgres:16-alpine
    container_name: claim_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: insurance_claims
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurance_claims"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate release migration step (Decision D3 / P8 Task 2)
  migration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: claim_platform_migration
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://migrator:migrator_secure_pass@db:5432/insurance_claims
      MIGRATOR_DATABASE_URL: postgresql+psycopg://migrator:migrator_secure_pass@db:5432/insurance_claims
      SECRET_KEY: local-dev-secret-key-32-chars-minimum-length
      AUDIT_HMAC_KEY: local-dev-audit-hmac-key-32-chars-minimum
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  demo_seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: claim_platform_demo_seed
    depends_on:
      migration:
        condition: service_completed_successfully
      demo_seed:
        condition: service_completed_successfully
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://app_rw:app_rw_secure_pass@db:5432/insurance_claims
      SECRET_KEY: local-dev-secret-key-32-chars-minimum-length
      AUDIT_HMAC_KEY: local-dev-audit-hmac-key-32-chars-minimum
    command: ["python", "-m", "scripts.seed"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: claim_platform_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://app_rw:app_rw_secure_pass@db:5432/insurance_claims
      SECRET_KEY: local-dev-secret-key-32-chars-minimum-length
      AUDIT_HMAC_KEY: local-dev-audit-hmac-key-32-chars-minimum
    volumes:
      - app_storage:/app/storage/documents

  caddy:
    image: caddy:2.8-alpine
    container_name: claim_platform_caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  app_storage:
  caddy_data:
  caddy_config:
