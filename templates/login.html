{% extends "base.html" %}

{% block title %}Sign In - ClaimFlow Platform{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <div class="card-header">
            <h2>Sign In</h2>
        </div>
        <form action="/ui/login" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" required autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </div>
        </form>
        <p style="margin: 18px 0 0; text-align: center; font-size: 13px;">
            New to ClaimFlow? <a href="/ui/register">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
