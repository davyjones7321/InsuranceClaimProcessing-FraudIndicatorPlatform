name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy Type Check
        run: |
          mypy app

      - name: Import Linter Determinism Check
        run: |
          lint-imports

  test:
    name: Tests & Migrations
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insurance_claims_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test Alembic Migrations Up and Down
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/insurance_claims_test
          MIGRATOR_DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/insurance_claims_test
          SECRET_KEY: ci-test-secret-key-32-chars-minimum-length
          AUDIT_HMAC_KEY: ci-test-audit-hmac-key-32-chars-minimum
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/insurance_claims_test
          MIGRATOR_DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/insurance_claims_test
          SECRET_KEY: ci-test-secret-key-32-chars-minimum-length
          AUDIT_HMAC_KEY: ci-test-audit-hmac-key-32-chars-minimum
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml
