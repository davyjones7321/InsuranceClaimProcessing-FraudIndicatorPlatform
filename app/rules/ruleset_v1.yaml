# Insurance Claim Platform Business Ruleset v1
ruleset_version: "v1"
engine_version: "1.0.0"

# Section A.1: Proposed claim-limit policy (CAP_WITH_WARNING vs REJECT)
claim_limit_policy: "CAP_WITH_WARNING"

validation_rules:
  V01:
    name: "Policy Exists & Belongs"
    version: "1.0"
    reason_code_not_found: "POLICY_NOT_FOUND"
    reason_code_mismatch: "POLICY_OWNER_MISMATCH"
  V02:
    name: "Policy Active"
    version: "1.0"
    reason_code: "POLICY_NOT_ACTIVE"
  V03:
    name: "Incident in Policy Period"
    version: "1.0"
    reason_code: "INCIDENT_OUTSIDE_POLICY_PERIOD"
  V04:
    name: "Valid Incident Date"
    version: "1.0"
    reason_code: "INCIDENT_DATE_INVALID"
  V05:
    name: "Filing Window"
    version: "1.0"
    filing_window_days: 90
    reason_code: "FILING_WINDOW_EXCEEDED"
  V07:
    name: "Coverage Exists"
    version: "1.0"
    reason_code: "NO_COVERAGE"
  V08:
    name: "Policy Exclusion Check"
    version: "1.0"
    reason_code: "EXCLUDED"
  V09:
    name: "Waiting Period"
    version: "1.0"
    reason_code: "WAITING_PERIOD_NOT_MET"
  V10:
    name: "Positive Requested Amount"
    version: "1.0"
    reason_code: "AMOUNT_INVALID"
  V11:
    name: "Coverage Limit Check"
    version: "1.0"
    reason_code: "LIMIT_EXCEEDED"
  V12:
    name: "Mandatory Fields"
    version: "1.0"
    reason_code: "MISSING_FIELD"
  V13:
    name: "Document Lifecycle"
    version: "1.0"
    reason_code_missing: "DOCUMENTS_MISSING"
    reason_code_invalid: "DOCUMENT_INVALID"
    reason_code_pending: "DOCUMENT_PENDING_REVIEW"

risk_thresholds:
  investigation_score_threshold: 25
  low_max: 24
  medium_max: 49
  high_min: 50

risk_indicators:
  R01:
    name: "Repeated claims by customer"
    version: "1.0"
    status: "PILOT"
    weight: 20
    threshold_claims: 3
    window_days: 365
  R02:
    name: "Repeated claims on policy"
    version: "1.0"
    status: "PILOT"
    weight: 15
    threshold_claims: 2
    window_days: 180
  R03:
    name: "High amount vs limit"
    version: "1.0"
    status: "PILOT"
    weight: 20
    limit_ratio_threshold_percent: 80
  R04:
    name: "Unusual amount vs peers"
    version: "1.0"
    status: "PILOT"
    weight: 15
    peer_multiple_threshold: 3
    min_historical_claims: 10
  R05:
    name: "Early claim"
    version: "1.0"
    status: "PILOT"
    weight: 25
    early_claim_window_days: 30
  R06:
    name: "Late-in-policy claim"
    version: "1.0"
    status: "PILOT"
    weight: 10
    late_policy_window_days: 7
  R07:
    name: "Duplicate suspicion"
    version: "1.0"
    status: "PILOT"
    weight: 30
    amount_variance_percent: 5
  R08:
    name: "Inconsistent document data"
    version: "1.0"
    status: "PILOT"
    weight: 20
  R09:
    name: "Late filing"
    version: "1.0"
    status: "PILOT"
    weight: 5
    late_filing_window_days: 15
  R10:
    name: "Round-number amount"
    version: "1.0"
    status: "PILOT"
    weight: 5
    round_multiple: 10000
    min_amount: 50000

