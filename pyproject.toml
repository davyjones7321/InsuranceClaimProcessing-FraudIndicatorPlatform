[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claim-platform"
version = "0.1.0"
description = "Deterministic rule-driven claim processing and fraud indicator platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=23.0.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.1",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "httpx>=0.27.2",
    "itsdangerous>=2.2.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.1",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-pyyaml>=6.0.12.20240917",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.engine.*"
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine determinism: engine must not import forbidden modules"
type = "forbidden"
source_modules = ["app.engine"]
forbidden_modules = [
    "app.db",
    "app.services",
    "app.api",
    "app.web",
    "app.security",
    "app.audit",
    "app.analytics",
    "sqlalchemy",
    "fastapi",
]
