{% extends "base.html" %}

{% block title %}Register Claim - ClaimFlow Platform{% endblock %}

{% block content %}
<div style="max-width: 720px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header">
            <h2>Register New Insurance Claim</h2>
        </div>
        <form action="/ui/claims/new" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="policy_id">Target Active Policy</label>
                <select id="policy_id" name="policy_id" required>
                    <option value="">-- Select Active Policy --</option>
                    {% for pol in available_policies %}
                        <option value="{{ pol.id }}">
                            {{ pol.policy_no }} - {{ pol.product_type }} (Insured: INR {{ "{:,.0f}".format(pol.sum_insured) }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="claim_category">Coverage Category</label>
                    <select id="claim_category" name="claim_category" required>
                        <option value="INPATIENT">INPATIENT</option>
                        <option value="OUTPATIENT">OUTPATIENT</option>
                        <option value="ACCIDENTAL_DAMAGE">ACCIDENTAL_DAMAGE</option>
                        <option value="THEFT">THEFT</option>
                        <option value="FIRE">FIRE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="incident_date">Incident Date</label>
                    <input type="date" id="incident_date" name="incident_date" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="requested_amount">Requested Payout (INR)</label>
                    <input type="number" id="requested_amount" name="requested_amount" min="1" step="0.01" required placeholder="50000.00">
                </div>
                <div class="form-group">
                    <label for="incident_location">Incident Location</label>
                    <input type="text" id="incident_location" name="incident_location" required placeholder="City / Hospital / Premises">
                </div>
            </div>

            <div class="form-group">
                <label for="incident_description">Incident Summary & Circumstances</label>
                <textarea id="incident_description" name="incident_description" rows="4" required placeholder="Provide clear factual summary of loss or hospitalization event..."></textarea>
            </div>

            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
                <a href="/ui/claims" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit Registration</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
