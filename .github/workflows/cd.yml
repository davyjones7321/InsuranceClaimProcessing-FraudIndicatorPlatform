name: CD Pipeline

on:
  push:
    branches: [main, master, "hardening/*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish Container Image (Build Once)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_name: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Automated)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.claimflow.internal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record previous stable image tag
        id: prev_tag
        run: |
          PREV_TAG=$(cat deploy/staging_current_tag.txt 2>/dev/null || echo "latest")
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Execute Database Migration (Separate Release Step)
        run: |
          echo "Running database migrations for staging..."
          # docker run --rm ${{ needs.build.outputs.image_name }} alembic upgrade head

      - name: Deploy container to Staging
        run: |
          echo "Deploying image ${{ needs.build.outputs.image_name }} to staging..."
          # Update staging compose / task definition and reload services

      - name: Verify Readiness Probe (/readyz)
        run: |
          echo "Verifying staging readiness..."
          # curl -f --retry 10 --retry-delay 3 https://staging.claimflow.internal/readyz

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Staging deployment failed. Rolling back to previous stable tag: ${{ steps.prev_tag.outputs.previous_tag }}"
          # Deploy ${{ steps.prev_tag.outputs.previous_tag }}

  deploy-production:
    name: Deploy to Production (Manual Approval Gate)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://claims.insurance.example
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record previous production image tag
        id: prev_prod_tag
        run: |
          PREV_PROD=$(cat deploy/production_current_tag.txt 2>/dev/null || echo "latest")
          echo "previous_prod_tag=$PREV_PROD" >> $GITHUB_OUTPUT

      - name: Execute Database Migration (Separate Release Step)
        run: |
          echo "Running production database migrations..."
          # docker run --rm ${{ needs.build.outputs.image_name }} alembic upgrade head

      - name: Deploy container to Production
        run: |
          echo "Deploying verified image ${{ needs.build.outputs.image_name }} to production..."
          # Zero-downtime rolling restart behind Caddy TLS reverse proxy

      - name: Verify Production Readiness Probe (/readyz)
        run: |
          echo "Verifying production readiness..."
          # curl -f --retry 10 --retry-delay 3 https://claims.insurance.example/readyz

      - name: Rollback Production on Failure
        if: failure()
        run: |
          echo "CRITICAL: Production deployment failed. Rolling back to ${{ steps.prev_prod_tag.outputs.previous_prod_tag }}"
